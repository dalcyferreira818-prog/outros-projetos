<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajupary - Anos 60</title>
   <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
        height: 100%; 
        overflow: hidden; 
        background-color: #556B2F; 
    }

    .topo-audio {
        height: 70px;
        background-color: #556B2F; 
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .topo-audio audio {
        width: 600px;
        max-width: 90%;
        height: 45px;
    }

    /* ESSA LINHA TIRA A CAIXA/FUNDO DO PLAYER */
    .topo-audio audio::-webkit-media-controls-panel {
        background-color: transparent !important;
    }

    iframe {
        width: 100%;
        height: calc(100vh - 70px);
        border: none;
        display: block;
    }
</style>
</head>
<body>

    <!-- O player de áudio fica aqui e nunca recarrega -->
    <div class="topo-audio">
        <audio controls autoplay loop src="interior.mp3"></audio>
    </div>

    <!-- O iframe carrega a primeira página inicial -->
    <iframe src="site-principal.html"></iframe>

</body>
</html>
